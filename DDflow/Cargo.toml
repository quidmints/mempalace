[package]
name = "mempalace_core"
version = "0.1.0"
edition = "2021"
description = "Append-only event log + DDflow incremental views, the substrate for MemPalace"
license = "MIT OR Apache-2.0"

[lib]
name = "mempalace_core"
crate-type = ["cdylib", "rlib"]

[dependencies]
# Differential Dataflow / Timely for incremental view maintenance
differential-dataflow = "0.12"
timely = "0.12"

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
bincode = "1.3"

# PyO3 boundary
pyo3 = { version = "0.20", features = ["extension-module", "abi3-py310"] }

# Hashing for content hashes and audit log
sha2 = "0.10"
hex = "0.4"

# Concurrency primitives
parking_lot = "0.12"
crossbeam-channel = "0.5"

# Error handling
thiserror = "1.0"
anyhow = "1.0"

# File I/O for log durability
fs2 = "0.4"        # advisory file locking
memmap2 = "0.9"    # mmap'd log access

# Time
chrono = { version = "0.4", features = ["serde"] }

# UUID for identifiers (Python side handles user-facing IDs; Rust uses
# u128 internally for log offsets and uuid for cross-process refs)
uuid = { version = "1.0", features = ["v4", "serde"] }

# Test-only deps
[dev-dependencies]
tempfile = "3.10"
proptest = "1.4"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
